<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bioquest</title>
  
  <!-- External Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Legend&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Main Container -->
  <div class="splash-container">

    <!-- Left Sidebar with Mission Statement -->
    <aside class="sidebar">
      <p class="mission-text">
        <span class="mission-label">Our Mission:</span> Discover your path in biotechnology through interactive exploration and local opportunity tracking
      </p>
    </aside>

    <!-- Main Content Area with Title and Action Button -->
    <main class="main-content">
      <div class="content-wrapper">
        <!-- Main Website Title in Cinzel Decorative -->
        <h1 class="main-title">Bioquest</h1>

        <!-- Interactive "Get started" Pill Button in Legend font -->
        <button id="getStartedBtn" class="btn-get-started" type="button">
          Get Started
        </button>
      </div>
    </main>

  </div>
</body>
</html>
